<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"

    />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "CodeTalkers",
      "description": "Premium web design and full-stack development agency specializing in custom React, Vite, and FastAPI platforms for small businesses.",
      "url": "https://codetalkers.vercel.app/",
      "image": "https://codetalkers.vercel.app/logo.png",
      "founders": [
        {
          "@type": "Person",
          "name": "John Wilson",
          "jobTitle": "Founder & Lead Engineer"
        },
        {
          "@type": "Person",
          "name": "Melissa Wilson",
          "jobTitle": "Co-Founder & UI/UX Director"
        }
      ],
      "areaServed": [
        { "@type": "City", "name": "Tulsa" },
        { "@type": "State", "name": "Oklahoma" }
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tulsa",
        "addressRegion": "OK",
        "addressCountry": "US"
      },
      "priceRange": "$$",
      "sameAs": [
        "https://github.com/Paintballskaguy/codetalkers"
      ]
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CodeTalkers",
      "url": "https://codetalkers.vercel.app/"
    }
    </script>

    <!-- Structured Data: FAQPage (must mirror the visible FAQ section) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does a small-business website cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every website we build is custom, so the price depends on what your business needs. We quote a clear, flat project price up front — no surprise monthly fees — and the quote is always free. Tell us about your business and we'll send pricing within 24 hours."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to build my website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most small-business websites take a few weeks from kickoff to launch, depending on the size of the site and how quickly we get your content and photos. You'll get a clear timeline along with your quote."
          }
        },
        {
          "@type": "Question",
          "name": "Do you only work with businesses in Oklahoma?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We're proudly based in Tulsa, Oklahoma and love working with local businesses, but we build for clients anywhere — the whole process works great online and over the phone."
          }
        },
        {
          "@type": "Question",
          "name": "I already have a website. Can you redesign it instead of starting over?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. We modernize slow, outdated, or hard-to-update sites all the time. We'll keep what's already working and rebuild what's holding you back."
          }
        },
        {
          "@type": "Question",
          "name": "Will my website work on phones and show up on Google?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every site we build is mobile-first and includes the SEO basics — fast loading, clean structure, and proper tags — so customers can find you on Google and use your site on any device."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to be technical to work with you?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not at all. We handle all the technical parts and explain everything in plain English. You focus on running your business; we'll handle the website."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
