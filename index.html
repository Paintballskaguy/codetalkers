<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>CodeTalkers | Premium Web Design & Full-Stack Development in Oklahoma</title>
    <meta name="title" content="CodeTalkers | Premium Web Design & Full-Stack Development in Oklahoma" />
    <meta name="description" content="CodeTalkers is a family-owned web design and full-stack development agency in Oklahoma. We build custom React, Vite, and FastAPI platforms that get small businesses booked." />
    <meta name="keywords" content="web design, full-stack development, React development, FastAPI, Oklahoma web agency, small business websites, custom web platforms, CodeTalkers" />
    <meta name="author" content="CodeTalkers - John & Melissa Wilson" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark light" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://codetalkers.vercel.app/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codetalkers.vercel.app/" />
    <meta property="og:title" content="CodeTalkers | Premium Web Design & Full-Stack Development in Oklahoma" />
    <meta property="og:description" content="Family-owned web design and full-stack development agency. Custom React, Vite & FastAPI platforms built to get small businesses booked." />
    <meta property="og:image" content="https://codetalkers.vercel.app/wordmark.png" />
    <meta property="og:image:alt" content="CodeTalkers wordmark logo" />
    <meta property="og:site_name" content="CodeTalkers" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://codetalkers.vercel.app/" />
    <meta property="twitter:title" content="CodeTalkers | Premium Web Design & Full-Stack Development" />
    <meta property="twitter:description" content="Family-owned web design and full-stack development agency. Custom React, Vite & FastAPI platforms built to get small businesses booked." />
    <meta property="twitter:image" content="https://codetalkers.vercel.app/wordmark.png" />
    <meta property="twitter:image:alt" content="CodeTalkers wordmark logo" />

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "CodeTalkers",
      "description": "Premium web design and full-stack development agency specializing in custom React, Vite, and FastAPI platforms for small businesses.",
      "url": "https://codetalkers.vercel.app/",
      "image": "https://codetalkers.vercel.app/logo.png",
      "founders": [
        {
          "@type": "Person",
          "name": "John Wilson",
          "jobTitle": "Founder & Lead Engineer"
        },
        {
          "@type": "Person",
          "name": "Melissa Wilson",
          "jobTitle": "Co-Founder & UI/UX Director"
        }
      ],
      "areaServed": {
        "@type": "State",
        "name": "Oklahoma"
      },
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "OK",
        "addressCountry": "US"
      },
      "priceRange": "$$",
      "sameAs": [
        "https://github.com/Paintballskaguy/codetalkers"
      ]
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CodeTalkers",
      "url": "https://codetalkers.vercel.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://codetalkers.vercel.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
